name: Check Code - Detekt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kalendar Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew :kalendar-foundation:detekt :kalendar:detekt :kalendar-sync:detekt :kalendar-testing:detekt :sample:detekt :docsite:detekt

      - name: Check binary compatibility
        run: ./gradlew :kalendar-foundation:apiCheck :kalendar:apiCheck :kalendar-sync:apiCheck :kalendar-testing:apiCheck

      - name: Run tests
        run: ./gradlew :kalendar-foundation:desktopTest :kalendar-sync:desktopTest :kalendar:testDebugUnitTest

      # :kalendar:desktopTest is where every Compose UI test in the library lives — drag, keyboard
      # navigation, accessibility, span bars, header centring. It used to be skipped entirely
      # because three of its tests compare against macOS-rasterised golden images; that hid the
      # other ~209. Those three carry the GoldenImageTests category and the build drops them off
      # macOS, so this runs everything else.
      - name: Run desktop UI tests
        run: ./gradlew :kalendar:desktopTest :kalendar-testing:desktopTest
