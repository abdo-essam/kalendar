# Build-only check that the Dokka API reference still generates. Deployment to GitHub Pages
# happens exclusively in deploy-demo.yml, which publishes the docs under /api alongside the demo.
name: Dokka Documentation

on: workflow_dispatch

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build API documentation
        run: ./gradlew :kalendar:dokkaGenerateHtml :kalendar-foundation:dokkaGenerateHtml
