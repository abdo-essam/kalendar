name: Deploy Demo - GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kalendar Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs distribution and API docs
        run: ./gradlew :sample:wasmJsBrowserDistribution :kalendar:dokkaGenerateHtml :kalendar-foundation:dokkaGenerateHtml

      - name: Assemble Pages site (demo at /, API docs at /api)
        run: |
          mkdir -p site/api
          cp -R sample/build/dist/wasmJs/productionExecutable/. site/
          cp -R kalendar/build/dokka/html site/api/kalendar
          cp -R kalendar-foundation/build/dokka/html site/api/kalendar-foundation

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
